name: Deploy su construct.mavida.com (GitHub Pages)

# Deploy automatico ad ogni push su main: build di produzione con Vite e
# pubblicazione su GitHub Pages (sorgente "GitHub Actions" nelle impostazioni
# del repo). Il dominio personalizzato sta in public/CNAME, che finisce in dist/
# e dice a Pages di servire il sito su construct.mavida.com; il DNS del
# sottodominio punta con un record CNAME a miziomon.github.io.
# Al termine invia una mail di esito (riuscito/fallito) tramite l'API di Resend.
#
# Le variabili VITE_* sono inlinate da Vite a compile-time, quindi vanno
# fornite ALLA BUILD. VITE_API_BASE_URL oggi non e' usata dall'app (non e'
# ancora agganciata ad hub) ma il secret e' gia' pronto per quando lo sara'.
#
# Secret usati: RESEND_API_KEY, VITE_API_BASE_URL. Non servono piu' credenziali
# SSH: il vecchio deploy via rsync su hosting cPanel e' stato sostituito.

on:
  push:
    branches: [main]
  # Consente anche l'avvio manuale dalla tab "Actions" di GitHub.
  workflow_dispatch: {}

# Pages richiede di scrivere il sito e un token OIDC per il deploy; il codice resta in sola lettura.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy concorrenti (due push ravvicinati): si accodano ed eseguono in
# ordine, cosi' vince l'ultimo push senza mai interrompere una pubblicazione a meta'.
concurrency:
  group: deploy-construct
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Vite 8 richiede Node 20.19+ / 22.12+
          cache: npm

      - name: Installazione dipendenze
        run: npm ci

      - name: Build di produzione
        env:
          # VITE_* inlinate nel bundle a compile-time (vedi nota in testa).
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # Pages serve 404.html per i percorsi sconosciuti: con una SPA a pagina singola
      # basta la stessa index, cosi' un link profondo (o un refresh) apre l'app.
      - name: Pagina 404 per la SPA
        run: cp dist/index.html dist/404.html

      - name: Carica il sito per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Un solo invio email di esito, sia in caso di successo sia di errore:
      # if: always() fa girare lo step anche se un passo precedente e' fallito;
      # job.status ("success"/"failure") decide oggetto e testo. Il JSON e'
      # costruito con jq (non per concatenazione di stringhe) cosi' il messaggio
      # di commit e' sempre correttamente escapato.
      - name: Notifica email di esito
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            SUBJECT="Deploy construct.mavida.com riuscito"
            HEADLINE="Il deploy su <strong>construct.mavida.com</strong> (GitHub Pages) e' stato completato con successo."
          else
            SUBJECT="Deploy construct.mavida.com FALLITO"
            HEADLINE="Il deploy su <strong>construct.mavida.com</strong> (GitHub Pages) e' fallito. Controlla il log del workflow."
          fi
          BODY="$(jq -n \
            --arg headline "$HEADLINE" \
            --arg sha "$COMMIT_SHA" \
            --arg msg "${COMMIT_MSG:-(avvio manuale, nessun commit)}" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            --arg subject "$SUBJECT" \
            '{
              from: "[Mavida] Claud.ia <api@mavida.com>",
              to: "maurizio@mavida.com",
              subject: $subject,
              html: ("<p>" + $headline + "</p><ul>"
                + "<li><strong>Commit:</strong> " + $sha + "</li>"
                + "<li><strong>Messaggio:</strong> " + $msg + "</li>"
                + "<li><strong>Autore:</strong> " + $actor + "</li>"
                + "</ul><p><a href=\"" + $url + "\">Apri il log del workflow</a></p>")
            }')"
          curl -sS --fail-with-body -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$BODY"
